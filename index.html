        body {

        header {

            padding: 60px 20px;

        /* 商品區塊 */

        .section-title {
            text-align: center;
            font-size: 1.5rem;
            color: #8a5a65;
            margin-bottom: 30px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            text-align: center;
            padding-bottom: 20px;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-img {
            width: 100%;
            height: 320px;
            background-color: #eee;
            object-fit: cover;
        }
        .product-title {

            color: #333;
        }
        .product-price {
